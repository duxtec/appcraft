[tool.poetry]
name = "Appcraft Project"
version = "0.0.1"
description = "Description of the Appcraft Project"
authors = ["John Doe <contact@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://example.com"
repository = "https://github.com/duxtec/appcraft"
documentation = "https://duxtec.github.io/appcraft/latest/index.html"
keywords = ["appcraft"]
classifiers = ["Development Status :: 4 - Beta"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
toml = "0.10.2"
pydantic = "^2.13.4"
injector = "^0.24.0"

[tool.poetry.group.dev.dependencies]
sphinx = "8.0.2"
flake8 = "6.1.0"
black = "^26.5.1"
isort = "^8.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
