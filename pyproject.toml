[project]
name = "appcraft"
version = "1.0.0b1"
description = "Appcraft is a modular framework designed to simplify software development by providing a structured and extensible architecture. It enables developers to create and manage complex applications with ease, ensuring scalability and maintainability."
authors = [{ name = "Dux Tecnologia", email = "contato@tpereira.com.br" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "scaffolding", "code-generator", "clean-architecture", "template"]
dependencies = [
    "toml"
]
classifiers= [
    'Development Status :: 4 - Beta',
    'Environment :: Console',
    'Intended Audience :: Developers',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Topic :: Software Development :: Code Generators',
    'Operating System :: OS Independent'
]

requires-python = ">=3.12"

readme = {file = "README.md", content-type = "text/markdown"}

[project.urls]
Homepage = "https://github.com/duxtec/appcraft"
Repository = "https://github.com/duxtec/appcraft"
Documentation = "https://duxtec.github.io/appcraft/latest/index.html"
Changelog = "https://duxtec.github.io/appcraft/latest/changelog.html"
Issues = "https://github.com/duxtec/appcraft/issues"

[project.scripts]
appcraft = "appcraft.cli:main"
appc = "appcraft.cli:main"


[build-system]
requires = ["setuptools", "wheel", "toml"]
build-backend = "setuptools.build_meta"

[tool.pyright]
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "sphinx>=9.1.0,<10.0.0",
    "sphinx_rtd_theme>=3.1.0,<4.0.0",
    "pyright>=1.1.400,<2.0.0",
    # Needed transitively by appcraft/scripts/release.py: it imports the
    # git/remote_repository/github templates' application.use_cases.git.*,
    # which pulls in domain.models (base's Pydantic-backed model layer)
    # through application.use_cases.UseCase's own ReadUseCase sibling.
    "pydantic>=2.13.4,<3.0.0",
]